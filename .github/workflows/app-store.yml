# Submits a release to App Review when a person approves it in Agent Loops: release.yml asks on
# the tag, and Approve starts this workflow on the tag with the Deployment it approved. It
# submits only that Deployment, only when it is approved (scripts/approval.sh): it waits for
# testflight.yml's TestFlight build of the tag to be processed, then submits it
# (scripts/asc.swift). Reject ships nothing, and the release stays on TestFlight. Run by hand,
# it refuses.
#
# It needs the secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID, as testflight.yml does.
name: app-store

on:
  workflow_dispatch:
    inputs:
      deployment:
        description: The GitHub Deployment that was approved in Agent Loops
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: app-store-${{ github.ref_name }}

env:
  BUNDLE_ID: __BUNDLE_ID__
  TAG: ${{ github.ref_name }}

jobs:
  submit:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: The app-store deploy was approved in Agent Loops
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT: ${{ inputs.deployment }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        run: bash scripts/approval.sh start app-store

      - name: The App Store Connect key is there
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ -z $ASC_KEY_P8 || -z $ASC_KEY_ID || -z $ASC_ISSUER_ID ]]; then
            echo "::error::Set the secrets ASC_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID. Nothing was submitted to App Review."
            exit 1
          fi
          bash scripts/asc-key.sh "$RUNNER_TEMP/asc.p8"

      # "What's New" is the tag's message.
      - name: Submit for App Review
        id: submit
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG"
          export WHATS_NEW="$(git tag -l --format='%(contents)' "$TAG")"
          swift scripts/asc.swift submit "${TAG#v}" --wait 110 | tee "$RUNNER_TEMP/submit.log"
          echo "build=$(tail -n 1 "$RUNNER_TEMP/submit.log")" >> "$GITHUB_OUTPUT"

      # What this run deployed: the App Store version, and the TestFlight build it submitted.
      - name: Say the deploy
        run: |
          echo "::notice title=deploy::testflight:$BUNDLE_ID/${{ steps.submit.outputs.build }}"
          echo "::notice title=deploy::appstore:$BUNDLE_ID/${TAG#v}"

      # How it went, in the Deployment's status: Agent Loops shows it in Lineage.
      - name: Say how it went
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
        run: bash scripts/approval.sh end "${{ job.status }}"
