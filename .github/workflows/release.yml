# Asks for the approvals of a version on each version tag (v1.2.0), on any GitHub plan, and
# ships nothing. For each of `testflight` and `app-store`, it makes a GitHub Deployment that
# waits (scripts/approval.sh). Agent Loops shows both in Needs You:
#   testflight   Approve starts testflight.yml, which uploads a build to TestFlight
#   app-store    Approve starts app-store.yml, which submits that build for App Review
# Reject ships nothing.
#
# GitHub Free has an environment's required reviewers on public repositories only, so this
# repository's deploys do not wait on them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  deployments: write

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Ask for the approvals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/approval.sh ask testflight testflight.yml
          bash scripts/approval.sh ask app-store app-store.yml
